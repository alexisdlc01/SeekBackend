# Local development only. Both services are bound to loopback and require
# credentials, so this file stays safe even if it is reached for on a host that
# is reachable from elsewhere.
services:
    mongo:
        image: mongo
        ports:
            - "127.0.0.1:27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-seek}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
        volumes:
            - mongo-data:/data/db
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data

volumes:
    mongo-data:
    redis-data:
